name = "spec4pbt"
version = "0.1.0"
defaultTargets = ["Spec4Pbt", "tests"]

[[lean_lib]]
name = "Spec4Pbt"
globs = ["Spec4Pbt.+"]

[[lean_lib]]
name = "tests"
globs = ["tests.CorrectGenTests"]

[[lean_lib]]
name = "properties"
globs = ["properties.+"]

[[lean_lib]]
name = "out"
globs = ["out.+"]

[[require]]
name = "palamedes"
git = "https://github.com/hgoldstein95/palamedes-lean"
rev = "c2012b84fc4ad8ee03e3528838175b959fcc9cf8"
