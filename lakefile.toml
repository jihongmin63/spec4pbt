name = "spec4pbt"
version = "0.1.0"
defaultTargets = ["Spec4Pbt"]

[[lean_lib]]
name = "Spec4Pbt"
srcDir = "scripts/lean"
globs = ["Spec4Pbt.+"]

[[lean_lib]]
name = "scripts"
globs = ["scripts.tests.CorrectGenTests"]

[[lean_lib]]
name = "properties"
globs = ["properties.+"]

[[lean_lib]]
name = "build"
globs = ["build.+"]

[[lean_lib]]
name = "specifications"
globs = ["specifications.+"]

[[require]]
name = "palamedes"
git = "https://github.com/hgoldstein95/palamedes-lean"
rev = "c2012b84fc4ad8ee03e3528838175b959fcc9cf8"
